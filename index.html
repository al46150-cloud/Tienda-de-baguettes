<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de baguettes</title>
    <style>

 body {
    font-family: Arial, sans-serif;
    background-color: rgb(216, 153, 69);
}

h1 {
    text-align: center;
    color: #333;
}

.container {
    border: 2px solid #fbfafa;
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 6px;
    max-width: 700px;
    margin: 0 auto;
}

select,
input[type="number"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
}

/*opción bloques en línea */
label {
    display: inline-block;
    margin: 4px 8px 4px 0;
}

.total {
    background-color: #fff3e0;
    color: black;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 12px;
    margin: 15px 0;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 12px;
    background-color: #e8743b;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    cursor: pointer;
}

button:hover {
    background-color: #c85a24;
}

/*FLEXBOX*/
.galeria {
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    margin-top: 20px;
}

.galeria img {
    width: 18%;
    border-radius: 6px;
}


    </style>
</head>
<body>
     <h1>Realiza tu pedido de baguettes</h1>
     <div class="container">
         <form id="pedidofrom" onchange="calcular()">

         <label for="especialidad">Especialidad</label>
         <select name="especialidad" id="especialidad">
         <option value="79.99">Clasica (79.99 MXN)</option>
         <option value="99.99">BBQ (99.99 MXN)</option>
         <option value="119.99">Tocino (119.99 MXN)</option>
         <option value="149.99">Doble tocino (149.99 MXN)</option>
         <option value="179.99">Hawaiana (179.99 MXN)</option>
         </select>

        <br>

        <label for="tip-pan">
             Tipo de pan:
        </label>
        <input type="radio" name="pan" id="pan" value="0"> Clasico
        <br>
        <input type="radio" name="pan" id="pan" value="19.99">Con Ajonjoli (+19.99 MXN)
        <br>
        <input type="radio" name="pan" id="pan" value="19.99">Integral (+19.99 MXN)
        <br>
        <input type="radio" name="pan" id="pan" value="19.99">brioche (+19.99 MXN)
        <br>

         <label for="ingredientes">
            Ingredientes adicionales (4.99 MXN c/u)
         </label>

            <p>Ingredientes adicionales (4.99 MXN c/u)</p>
            <label><input type="checkbox" name="queso" value="queso"> Queso</label>
            <label><input type="checkbox" name="queso" value="4.99"> Lechuga</label>
            <label><input type="checkbox" name="queso" value="4.99"> Jitomate</label>
            <label><input type="checkbox" name="queso" value="4.99"> Cebolla</label>
            <label><input type="checkbox" name="queso" value="4.99"> Jalapeño</label>
            <label><input type="checkbox" name="queso" value="4.99"> Huevo</label>
            <label><input type="checkbox" name="queso" value="4.99"> Pepino</label>
            <label><input type="checkbox" name="queso" value="4.99"> Champiñones</label>
            <label><input type="checkbox" name="queso" value="4.99"> Tocino extra</label>
            <label><input type="checkbox" name="queso" value="4.99"> Doble Queso</label>
            <label><input type="checkbox" name="queso" value="4.99"> Piña</label>
            <label><input type="checkbox" name="queso" value="4.99"> Guacamole</label>
            <label><input type="checkbox" name="queso" value="4.99"> Salsa BBQ</label>
            <label><input type="checkbox" name="queso" value="4.99"> Aderezo Chipotle</label>
            <label><input type="checkbox" name="queso" value="4.99"> Mayonesa</label>
            <label><input type="checkbox" name="queso" value="4.99"> Mostaza</label>
            <label><input type="checkbox" name="queso" value="4.99"> Ketchup</label>
            <label><input type="checkbox" name="queso" value="4.99"> Pepperoni</label>
            <label><input type="checkbox" name="queso" value="4.99"> Arúcula</label>
            <label><input type="checkbox" name="queso" value="4.99"> Cebolla Caramelizada</label>

         <br>
        <label for="cantidad">Cantidad de baguettes</label>
        <input type="number" name="cantidad" id="cantidad" required min="1" value="1">


        <label for="domicilio">
            <input type="checkbox" name="domicilio" id="domicilio">
            ¿Es a domicilio? (+ 29.99 MXN)
        </label>

        <div class="total" id="total">
         Total:$0.00 MXN
        </div>

        <button type="button" onclick="calcular()">Calcular total</button>

        </form>
        </div>

     <div class="galeria">
            <img src="img/132-SANDWICH-DE-CERDO-BBQ.webp" alt="Baguette BBQ">
            <img src="img/75868600.jpg" alt="Baguette">
            <img src="img/75869405.jpg" alt="Baguette">
            <img src="img/p_26920.jpg.webp" alt="Baguette">
            <img src="img/receta_sandwich_sub.png" alt="Baguette">
        </div>
    </div>
     <script src="script.js"></script>
    
</body>
</html>
